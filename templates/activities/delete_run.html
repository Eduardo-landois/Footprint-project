{% extends 'base.html' %}

{% block title %}Delete run · Footprint{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Delete this run?</h2>
    <div class="alert alert-danger">
      {{ run.distance }} mi on {{ run.date }}{% if run.title %} ({{ run.title }}){% endif %}.
      This can't be undone.
    </div>

    <form method="POST">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete it</button>
      <a class="btn btn-outline-secondary" href="{% url 'run_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
