{% extends 'base.html' %}

{% block title %}Edit profile · Footprint{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Edit profile</h2>

    {% if errors %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <label class="form-label">First name:</label>
      <input class="form-control" type="text" name="first_name" value="{{ first_name }}">

      <label class="form-label mt-3">Last name:</label>
      <input class="form-control" type="text" name="last_name" value="{{ last_name }}">

      <label class="form-label mt-3">Email:</label>
      <input class="form-control" type="email" name="email" value="{{ email }}" required>

      <button class="btn btn-primary mt-3" type="submit">Save changes</button>
      <a class="btn btn-outline-secondary mt-3" href="{% url 'profile' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
