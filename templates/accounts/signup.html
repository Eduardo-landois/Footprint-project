{% extends 'base.html' %}

{% block title %}Sign up · Footprint{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Create your account</h2>

    {% if errors %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <label class="form-label">Username:</label>
      <input class="form-control" type="text" name="username" value="{{ username }}" required>

      <label class="form-label mt-3">Email:</label>
      <input class="form-control" type="email" name="email" value="{{ email }}" required>

      <label class="form-label mt-3">Password:</label>
      <input class="form-control" type="password" name="password1" required>

      <label class="form-label mt-3">Confirm password:</label>
      <input class="form-control" type="password" name="password2" required>

      <button class="btn btn-primary mt-3" type="submit">Sign up</button>
    </form>

    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
